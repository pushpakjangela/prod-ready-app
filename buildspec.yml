version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  build:
    commands:
      - echo "Java version:"
      - java -version
      - echo "Maven version:"
      - mvn -version
      - echo "Building application..."
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

cache:
  paths:
    - '/root/.m2/**/*'