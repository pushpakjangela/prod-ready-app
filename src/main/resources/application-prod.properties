# Production Profile - Uses RDS MSSQL
spring.datasource.url=jdbc:sqlserver://${DB_HOST_NAME}:3306;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false